[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uptimesquirrel-agent"
version = "2.1.15"
description = "UptimeSquirrel system monitoring agent — collects metrics and executes synthetic checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
    { name = "Scripted Ventures", email = "support@uptimesquirrel.com" },
]
keywords = ["monitoring", "uptime", "metrics", "agent", "synthetic-checks", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "aiohttp>=3.9",
    "certifi>=2024.2.2",
    "psutil>=5.9",
    "requests>=2.31",
    "urllib3>=2.0",
]

[project.optional-dependencies]
snmp = ["pysnmp>=5.0"]

[project.urls]
Homepage = "https://uptimesquirrel.com"
Documentation = "https://docs.uptimesquirrel.com/agent"
Repository = "https://github.com/Scripted-Ventures-NZ/uptimesquirrel-agent-pypi"
Issues = "https://github.com/Scripted-Ventures-NZ/UptimeSquirrel/issues"

[project.scripts]
uptimesquirrel-agent = "uptimesquirrel_agent.agent:main"

[tool.setuptools.packages.find]
include = ["uptimesquirrel_agent*"]
exclude = ["test-env*", "tests*"]